# XcodeGen project definition.
#
#   brew install xcodegen
#   cd LevelMaker-iOS && xcodegen generate && open LevelMaker.xcodeproj
#
# The .xcodeproj is generated, not committed, so there is no pbxproj to merge
# and this file is the whole project definition.

name: LevelMaker
options:
  bundleIdPrefix: com.levelmaker
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

targets:
  LevelMaker:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Bridge/LevelMaker-Bridging-Header.h"
      - path: Sources/Bridge/LevelMaker-Bridging-Header.h
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: LevelMaker
        PRODUCT_BUNDLE_IDENTIFIER: com.levelmaker.LevelMaker
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

        # iPhone and iPad from one target.
        TARGETED_DEVICE_FAMILY: "1,2"

        # Swift 5 language mode: this is a single-threaded editor and Swift 6's
        # strict concurrency checking has nothing useful to say about it.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/LevelMaker-Bridging-Header.h

        # The engine is C++17; the views are Objective-C++ and pick this up too.
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        CLANG_ENABLE_OBJC_ARC: YES

        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Engine
          - $(SRCROOT)/Sources/Bridge
          - $(SRCROOT)/Sources/Views

        # Nothing here needs Metal 3, so the floor stays at the A12X.
        MTL_FAST_MATH: YES

        CODE_SIGN_STYLE: Automatic
        # Set this to your team, or just pick the team in Xcode's Signing tab
        # once and it will be written back here on the next generate.
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
          ONLY_ACTIVE_ARCH: YES
        Release:
          MTL_ENABLE_DEBUG_INFO: NO
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  LevelMaker:
    build:
      targets:
        LevelMaker: all
    run:
      config: Debug
    archive:
      config: Release
